name: Render video
run-name: Render ${{ inputs.job }}

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Job id (jobs/<id>/job.json)"
        required: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JOB: ${{ inputs.job }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate job id
        run: |
          [[ "$JOB" =~ ^[A-Za-z0-9_-]{4,64}$ ]] || { echo "bad job id"; exit 1; }

      - uses: actions/checkout@v4

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fontconfig

      - name: Render
        run: node render/render.js "jobs/$JOB" "out/video.mp4"

      - name: Publish result as a release
        run: |
          gh release create "render-$JOB" out/video.mp4 --title "render-$JOB" --notes "Rendered by Reels Factory"

      - name: Clean up job files and old releases
        if: always()
        run: |
          git config user.name "render-bot"
          git config user.email "render-bot@users.noreply.github.com"
          git pull --rebase -q || true
          if [ -d "jobs/$JOB" ]; then
            git rm -r -q "jobs/$JOB"
            git commit -q -m "cleanup jobs/$JOB"
            git push -q || (git pull --rebase -q && git push -q) || true
          fi
          # সর্বশেষ ৩০টা রিলিজ রাখা হয়, পুরনোগুলো মুছে যায়
          gh release list --limit 200 --json tagName --jq '.[30:][].tagName' | while read -r tag; do
            gh release delete "$tag" --cleanup-tag -y || true
          done
          
